name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the unit-test agent after it pushes tests (GITHUB_TOKEN pushes do not trigger runs).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.package }} — typecheck, tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.package == 'backend'
        run: npx --no-install prisma generate
      - run: npm run typecheck
      - if: matrix.package == 'frontend'
        run: npm run format:check
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          jq -r '.total | "| ${{ matrix.package }} | \(.lines.pct)% | \(.branches.pct)% | \(.functions.pct)% |"' coverage/coverage-summary.json \
            | { echo '| Package | Lines | Branches | Functions |'; echo '| --- | --- | --- | --- |'; cat; } >> "$GITHUB_STEP_SUMMARY"
